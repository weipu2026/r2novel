# 一键部署：把 Secrets 填进 GitHub → push main 即发布。仓库零敏感信息（域名也是 Secret）。
#
# Secrets 一览（逐步获取教程见 README「GitHub Actions 部署」一节）：
#   CLOUDFLARE_API_TOKEN   API Token（Account·Workers Scripts:Edit + Account·R2:Edit；绑域名再加 Zone·Workers Routes:Edit）
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare 账户 ID（dashboard 首页右侧）
#   ADMIN_PASSWORD         网站登录口令
#   SESSION_SECRET         Cookie 的 HMAC 密钥（node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"）
#   CUSTOM_DOMAIN          自定义域名（可选；留空用 workers.dev 地址）
#
# 流程：单测+语法 → 建桶(幂等) → 注入域名 → wrangler deploy → 同步 secrets → 对生产跑端到端冒烟（自动清走测试书）。

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-r2novel
  cancel-in-progress: false

# 最小权限：本工作流只读取仓库内容（凭据全部走 Secrets，不写回仓库）
permissions:
  contents: read

# 注意：Cloudflare 凭据刻意不放 workflow 级 env —— 那会注入到 npm ci / npm test 等
# 所有 step 的环境（含第三方依赖的任何生命周期脚本）。只在下游真正调 wrangler 的
# step 上按需注入。

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 单测 + 语法检查
        run: npm test && npm run check

      # 幂等：桶已存在可继续往下走；但**只放行「已存在」这一种失败**——原写法
      # `|| echo` 会吞掉一切失败，token 缺 R2:Edit 时也会打印「bucket 已存在」，
      # 之后部署失败却查不到真正原因
      - name: 确保 R2 桶存在
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          OUT=$(npx wrangler r2 bucket create r2novel-7d1a 2>&1)
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "· R2 桶已创建"
          elif printf '%s' "$OUT" | grep -qiE 'already exists|already owned by you|10004'; then
            echo "· R2 桶已存在，跳过"
          else
            printf '%s\n' "$OUT"
            echo "::error::创建 R2 桶失败——请检查 CLOUDFLARE_API_TOKEN 是否含 Account·R2:Edit"
            exit 1
          fi

      # 域名不进仓库：CUSTOM_DOMAIN 非空时注入 wrangler.toml 副本末尾；
      # 为空则用默认 workers.dev 地址（域名值不打印到日志）。
      # Secrets 一律经 env: 传入，绝不直接插进 run: —— 若值含 "、$、反引号，
      # 直接插值会被 shell 二次解析（破坏命令甚至注入）
      - name: 注入自定义域名
        env:
          CUSTOM_DOMAIN: ${{ secrets.CUSTOM_DOMAIN }}
        run: |
          if [ -z "$CUSTOM_DOMAIN" ]; then
            echo "· 跳过域名绑定（CUSTOM_DOMAIN 未设置），使用 workers.dev 地址"
            exit 0
          fi
          echo "::add-mask::$CUSTOM_DOMAIN" # 日志脱敏：公开仓库的 Actions 日志可见
          # 幂等：每次 push 都追加 [[routes]] 会让 wrangler.toml 积累多段重复路由；
          # 已注入过（含 custom_domain 标记）则跳过
          if grep -q 'custom_domain = true' wrangler.toml; then
            echo "· 已注入过域名，跳过（幂等）"
            exit 0
          fi
          printf '\n[[routes]]\npattern = "%s"\ncustom_domain = true\n' \
            "$CUSTOM_DOMAIN" >> wrangler.toml
          echo "· 已绑定域名（值不打印到日志）"

      # pipefail 保证 wrangler 失败时步骤失败（tee 会吞退出码）；输出存档用于提取访问地址
      - name: 部署 Worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          # SW 缓存版本自动化（路径 B）：每次部署用时间戳替换 CACHE 版本号，
          # 保证「push 后用户第一次打开就是新前端」，消除手动 bump 的遗忘风险；
          # 只改 runner 上的副本，仓库文件不受影响。
          # 匹配式放宽为「任意版本串」并**替换后自校验**：原先写死 '...-v[0-9]*'，
          # 一旦仓库里的字面量格式被改动（如去掉 v），sed 会静默不匹配 →
          # SW 版本号永不变化 → 用户长期跑旧前端，且没有任何报错提示。
          sed -i -E "s|const CACHE = '[^']*';|const CACHE = 'r2novel-shell-$(date +%s)';|" public/sw.js
          if ! grep -q "const CACHE = 'r2novel-shell-" public/sw.js; then
            echo "::error::public/sw.js 的 CACHE 版本号替换失败（字面量格式已变？）"
            exit 1
          fi
          npx wrangler deploy 2>&1 | tee deploy.log

      # 先部署代码（保证 Worker 存在，secret put 才有目标），再同步密钥；改 Secret 后跑一次部署即生效
      - name: 同步密钥到 Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          set -e
          put() {
            local name="$1" val="$2"
            if [ -z "$val" ]; then
              echo "· 跳过 $name（GitHub Secrets 未设置）"
              return 0
            fi
            printf '%s' "$val" | npx wrangler secret put "$name"
            echo "· $name 已同步"
          }
          put ADMIN_PASSWORD "$ADMIN_PASSWORD"
          put SESSION_SECRET "$SESSION_SECRET"

      # 部署后对生产环境跑端到端冒烟（登录→建书→传章→发布→读章→进度→管理→清理）
      # SMOKE_CLEANUP=1：自动彻底删除测试书，不留垃圾；同名遗留会先清再建，可重复执行
      # 加固：custom domain 刚建时 DNS 需数十秒才在 runner 解析器生效 → 先轮询解析成功再跑冒烟；
      #       冒烟本身遇瞬时网络/DNS 抖动最多自动重试 3 次
      - name: 生产冒烟
        env:
          CUSTOM_DOMAIN: ${{ secrets.CUSTOM_DOMAIN }}
          SMOKE_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          set -e
          if [ -n "$CUSTOM_DOMAIN" ]; then
            SMOKE_BASE="https://$CUSTOM_DOMAIN"
          else
            SMOKE_BASE=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1 || true)
            if [ -z "$SMOKE_BASE" ]; then
              echo "· 未能从部署输出解析 workers.dev 地址，跳过冒烟"
              exit 0
            fi
          fi
          # 日志脱敏：域名/地址是 Secret 派生的，公开仓库的 Actions 日志可见
          echo "::add-mask::$SMOKE_BASE"
          echo "· 冒烟目标已就绪"
          HOST=$(echo "$SMOKE_BASE" | sed -E 's#https?://##; s#/.*##')
          echo "· 等待域名解析 $HOST ..."
          for i in $(seq 1 20); do
            if getent ahostsv4 "$HOST" >/dev/null 2>&1 || getent ahosts "$HOST" >/dev/null 2>&1; then
              echo "  解析成功（第 $i 次探测）"
              break
            fi
            if [ "$i" -eq 20 ]; then echo "  ⚠ 轮询 100s 仍未解析，继续尝试冒烟"; fi
            sleep 5
          done
          for attempt in 1 2 3; do
            if SMOKE_BASE="$SMOKE_BASE" SMOKE_CLEANUP=1 node scripts/smoke.mjs; then
              echo "· 冒烟通过（第 $attempt 次尝试）"
              break
            fi
            if [ "$attempt" -eq 3 ]; then echo "· 冒烟连续 3 次失败"; exit 1; fi
            echo "· 冒烟异常，30s 后自动重试..."
            sleep 30
          done

      - name: 部署完成
        run: echo "✅ r2novel 已部署并通过生产冒烟"
